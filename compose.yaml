services:
  macrocart:
    build: .
    image: macrocart:local
    ports:
      # Localhost only: put a reverse proxy (with authentication) in front of it.
      - "127.0.0.1:${MACROCART_PORT:-5000}:5000"
    env_file:
      - path: .env
        required: false
    volumes:
      - macrocart-data:/app/data
      # Optional: a NutriTrace data folder, read-only. Without it the board starts
      # empty and you fill it from "Search the internet".
      - ${NUTRITRACE_DIR:-./nutritrace}/db:/nutritrace/db:ro
      - ${NUTRITRACE_DIR:-./nutritrace}/uploads:/nutritrace/uploads:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 128m

volumes:
  macrocart-data:
