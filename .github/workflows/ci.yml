name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scripts and inline blocks
        run: |
          for f in web/js/*.js web/sw.js tests/*.mjs; do node --check "$f"; echo "$f ok"; done
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path("web/index.html").read_text(encoding="utf-8")
          for n, js in enumerate(re.findall(r"<script>(.*?)</script>", html, re.S)):
              pathlib.Path(f"/tmp/block{n}.js").write_text(js, encoding="utf-8")
          PY
          for f in /tmp/block*.js; do node --check "$f"; echo "$f ok"; done
          python3 -c "import json; json.load(open('web/manifest.webmanifest'))"

  e2e:
    name: Browser test (Playwright)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Run
        run: node tests/e2e.mjs

  android:
    name: Android build (unsigned)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease lintRelease
