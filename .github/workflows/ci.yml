name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scripts and inline blocks
        run: |
          for f in web/js/*.js web/sw.js tests/*.mjs; do node --check "$f"; echo "$f ok"; done
          # The CSP blocks inline scripts and handlers: page code belongs in web/js/.
          python3 - <<'PY'
          import re, pathlib, sys
          html = pathlib.Path("web/index.html").read_text(encoding="utf-8")
          bad = re.findall(r"<script(?![^>]*\bsrc=)[^>]*>|\son[a-z]+\s*=", html, re.I)
          if bad:
              sys.exit(f"index.html has inline script or handlers (blocked by the CSP): {bad}")
          if 'http-equiv="Content-Security-Policy"' not in html:
              sys.exit("index.html lost its Content-Security-Policy")
          print("index.html: no inline scripts, CSP present")
          PY
          python3 -c "import json; json.load(open('web/manifest.webmanifest'))"

  e2e:
    name: Browser test (Playwright)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Run
        run: node tests/e2e.mjs

  android:
    name: Android build (unsigned)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease lintRelease
